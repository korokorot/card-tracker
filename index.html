<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ポケカBOX相場</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --sub: #94a3b8;
      --accent: #38bdf8;
      --plus: #22c55e;
      --minus: #ef4444;
      --border: #334155;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 8px;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
      background: var(--bg); color: var(--text);
    }
    .header-row {
      display: flex; justify-content: space-between; align-items: center;
      gap: 6px; margin-bottom: 4px;
    }
    h1 { font-size: 15px; margin: 0; white-space: nowrap; }
    .updated { font-size: 10px; color: var(--sub); margin-bottom: 8px; }
    .section-title {
      font-size: 14px; font-weight: bold; margin: 18px 0 6px 0; color: var(--accent);
      display: flex; justify-content: space-between; align-items: baseline;
    }
    .section-sub { font-size: 10px; color: var(--sub); font-weight: normal; }

    .mode-switch {
      display: inline-flex; background: var(--card); border-radius: 8px;
      border: 1px solid var(--border); overflow: hidden; flex-shrink: 0;
    }
    .mode-btn {
      padding: 5px 8px; font-size: 11px; font-weight: bold;
      color: var(--sub); cursor: pointer; white-space: nowrap;
    }
    .mode-btn.active { background: var(--accent); color: #0f172a; }

    .summary-wrap {
      background: var(--card); border-radius: 10px;
      border: 1px solid var(--border); margin-bottom: 18px; overflow: hidden;
    }
    .summary-table {
      width: 100%; border-collapse: collapse; table-layout: fixed;
    }
    .summary-table th, .summary-table td {
      padding: 7px 2px; text-align: right; border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    .summary-table th:first-child, .summary-table td:first-child {
      text-align: left; padding-left: 6px; width: 32%;
      border-right: 1px solid var(--border);
    }
    .summary-table th:not(:first-child), .summary-table td:not(:first-child) {
      width: 17%;
    }
    .summary-table th {
      background: #1e293b; color: var(--sub); font-size: 10px;
      border-bottom: 2px solid var(--border); white-space: nowrap;
    }
    .cat-row td {
      background: #172033 !important; color: #f59e0b; font-weight: bold;
      font-size: 10px; padding: 4px 6px !important; text-align: left !important;
      border-right: none !important;
    }
    .box-row { cursor: pointer; transition: background 0.15s; }
    .box-row:active, .box-row:hover { background: #26334d; }

    .box-title {
      font-weight: bold; font-size: 11px; color: var(--text);
      line-height: 1.2; margin-bottom: 2px; word-break: keep-all;
    }
    .box-meta {
      font-size: 9px; color: var(--sub); line-height: 1.1; white-space: nowrap;
    }
    .profit-pos { color: var(--plus); font-weight: bold; margin-left: 2px; }
    .profit-neg { color: var(--minus); font-weight: bold; margin-left: 2px; }

    .p-val { font-size: 11px; font-weight: bold; display: block; white-space: nowrap; }
    .best-badge {
      background: rgba(56, 189, 248, 0.15); border-radius: 3px;
      padding: 1px 2px; color: #38bdf8; font-weight: bold; font-size: 11px;
      display: inline-block; white-space: nowrap;
    }
    .mini-diff { font-size: 8px; display: block; margin-top: 1px; white-space: nowrap; font-weight: bold; }
    .up { color: var(--plus); }
    .down { color: var(--minus); }
    .even { color: var(--sub); font-weight: normal; }

    @media (min-width: 600px) {
      body { padding: 16px; max-width: 960px; margin: 0 auto; }
      h1 { font-size: 18px; }
      .summary-table th, .summary-table td { padding: 10px 8px; }
      .box-title { font-size: 13px; }
      .box-meta { font-size: 11px; }
      .p-val, .best-badge { font-size: 13px; }
      .mini-diff { font-size: 10px; }
    }

    .tabs { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
    .tab {
      padding: 6px 9px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--card); color: var(--sub); font-weight: bold; font-size: 11px; cursor: pointer;
    }
    .tab.active { background: var(--accent); color: #0f172a; border-color: var(--accent); }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .card {
      background: var(--card); padding: 10px; border-radius: 10px;
      border: 1px solid var(--border); cursor: pointer; user-select: none;
    }
    .card-top {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;
    }
    .card-title { font-size: 11px; color: var(--sub); }
    .line-btn {
      font-size: 9px; padding: 2px 6px; border-radius: 4px; font-weight: bold;
      background: #0f172a; color: var(--sub); border: 1px solid var(--border);
      white-space: nowrap;
    }
    .price { font-size: 15px; font-weight: bold; color: var(--text); }
    .sub-note { font-size: 9px; color: var(--sub); margin-top: 3px; }
    
    .chart-box { background: var(--card); padding: 12px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 16px; }
    .chart-header {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 6px; margin-bottom: 8px;
    }
    .range-switch {
      display: inline-flex; background: #0f172a; border-radius: 6px;
      border: 1px solid var(--border); overflow: hidden;
    }
    .range-btn {
      padding: 4px 8px; font-size: 10px; font-weight: bold;
      color: var(--sub); cursor: pointer; white-space: nowrap;
    }
    .range-btn.active { background: var(--accent); color: #0f172a; }

    .hist-table { width: 100%; border-collapse: collapse; font-size: 10px; background: var(--card); border-radius: 12px; overflow: hidden; }
    .hist-table th, .hist-table td { padding: 7px 4px; text-align: right; border-bottom: 1px solid var(--border); }
    .hist-table th:first-child, .hist-table td:first-child { text-align: left; }
    .hist-table th { background: #334155; color: var(--text); }
  </style>
</head>
<body>

  <div class="header-row">
    <h1>📦 ポケカBOX相場</h1>
    <div class="mode-switch">
      <div class="mode-btn active" id="btn-with" onclick="setShrinkMode('with')">シュリンク有</div>
      <div class="mode-btn" id="btn-without" onclick="setShrinkMode('without')">シュリンク無</div>
    </div>
  </div>
  <div class="updated" id="last-updated">データ読込中...</div>

  <div class="summary-wrap">
    <table class="summary-table" id="summary-table">
      <thead>
        <tr>
          <th>商品名 / 定価(差益)</th>
          <th>メルカリ</th>
          <th>Yahoo!</th>
          <th>スニダン</th>
          <th>ホムラ</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="section-title" id="detail-section">
    <span>📊 個別BOX 相場推移＆履歴</span>
    <span class="section-sub">※カードのボタンでグラフON/OFF</span>
  </div>
  <div class="tabs" id="box-tabs"></div>
  <div class="grid" id="price-cards"></div>

  <div class="chart-box">
    <div class="chart-header">
      <div class="card-title" id="chart-title" style="margin:0;">📈 価格推移グラフ</div>
      <div class="range-switch">
        <div class="range-btn" id="range-7" onclick="setChartRange(7)">1週間</div>
        <div class="range-btn" id="range-30" onclick="setChartRange(30)">1ヶ月</div>
        <div class="range-btn" id="range-90" onclick="setChartRange(90)">3ヶ月</div>
        <div class="range-btn active" id="range-0" onclick="setChartRange(0)">全期間</div>
      </div>
    </div>
    <canvas id="priceChart" height="220"></canvas>
  </div>

  <div class="card-title" style="margin-bottom:6px;">🕒 過去の記録履歴（直近10回）</div>
  <div style="overflow-x:auto;">
    <table class="hist-table" id="history-table">
      <thead>
        <tr>
          <th>日時</th>
          <th>メルカリ<br>(有/無)</th>
          <th>Yahoo!<br>(有/無)</th>
          <th>スニダン<br>(有/無)</th>
          <th>ホムラ<br>(有/無)</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

<script>
let rawData = [];
let shrinkMode = "with";
let currentBoxId = "30th_celebration";
let chartRangeDays = 0;
let chartInstance = null;

let activeChartKeys = new Set([
  "mercari_with",
  "yahoo_with",
  "snkrdunk_with",
  "homura_with"
]);

const SERIES_CONFIG = [
  { key: "mercari_with",     label: "メルカリ (有)",     shortLabel: "メルカリ(有)", color: "#ef4444", dash: [],    feeRate: 0.9,  noteText: "" },
  { key: "mercari_without",  label: "メルカリ (無)",     shortLabel: "メルカリ(無)", color: "#f87171", dash: [5,4], feeRate: 0.9,  noteText: "" },
  { key: "yahoo_with",       label: "Yahoo!フリマ (有)", shortLabel: "Yahoo!(有)",   color: "#f59e0b", dash: [],    feeRate: 0.95, noteText: "" },
  { key: "yahoo_without",    label: "Yahoo!フリマ (無)", shortLabel: "Yahoo!(無)",   color: "#fbbf24", dash: [5,4], feeRate: 0.95, noteText: "" },
  { key: "snkrdunk_with",    label: "スニダン (有)",     shortLabel: "スニダン(有)", color: "#38bdf8", dash: [],    feeRate: null, noteText: "" },
  { key: "snkrdunk_without", label: "スニダン (無)",     shortLabel: "スニダン(無)", color: "#7dd3fc", dash: [5,4], feeRate: null, noteText: "" },
  { key: "homura_with",      label: "買取ホムラ (有)",   shortLabel: "ホムラ(有)",   color: "#22c55e", dash: [],    feeRate: null, noteText: "手数料なし即金" },
  { key: "homura_without",   label: "買取ホムラ (無)",   shortLabel: "ホムラ(無)",   color: "#4ade80", dash: [5,4], feeRate: null, noteText: "手数料なし即金" }
];

const BOX_MASTER = [
  { id: "30th_celebration", name: "30th CELEBRATION", short: "30th BOX", cat: "MEGA 拡張・ハイクラス（発売日順）", retail: 7200 },
  { id: "storm_emeralda", name: "ストームエメラルダ", short: "ストームエメラルダ", cat: "MEGA 拡張・ハイクラス（発売日順）", retail: 6000 },
  { id: "abyss_eye", name: "アビスアイ", short: "アビスアイ", cat: "MEGA 拡張・ハイクラス（発売日順）", retail: 6000 },
  { id: "munikis_zero", name: "ムニキスゼロ", short: "ムニキスゼロ", cat: "MEGA 拡張・ハイクラス（発売日順）", retail: 5400 },
  { id: "mega_dream_ex", name: "MEGAドリームex", short: "MEGAドリームex", cat: "MEGA 拡張・ハイクラス（発売日順）", retail: 5500 },
  { id: "sp_box_tohoku", name: "SPBOX トウホク", short: "SP トウホク", cat: "スペシャルBOX・記念セット", retail: 2090 },
  { id: "sp_box_hiroshima", name: "SPBOX ヒロシマ", short: "SP ヒロシマ", cat: "スペシャルBOX・記念セット", retail: 2090 },
  { id: "sp_box_fukuoka", name: "SPBOX フクオカ", short: "SP フクオカ", cat: "スペシャルBOX・記念セット", retail: 2090 },
  { id: "30th_card_set_9", name: "30th 9種セット", short: "30th 9種セット", cat: "スペシャルBOX・記念セット", retail: 10800 },
  { id: "30th_deck_espeon_umbreon", name: "30th エーフィ・ブラッキー", short: "エーフィ・ブラッキー", cat: "スペシャルBOX・記念セット", retail: 6600 }
];

function fmt(val) {
  return val ? "¥" + val.toLocaleString() : "―";
}

function fmtDiffInline(curr, prev) {
  if (!curr || !prev) return `<span class="mini-diff even">±0</span>`;
  const d = curr - prev;
  if (d > 0) return `<span class="mini-diff up">+¥${d.toLocaleString()}</span>`;
  if (d < 0) return `<span class="mini-diff down">-¥${Math.abs(d).toLocaleString()}</span>`;
  return `<span class="mini-diff even">±0</span>`;
}

function setShrinkMode(mode) {
  shrinkMode = mode;
  document.getElementById("btn-with").className = "mode-btn" + (mode === "with" ? " active" : "");
  document.getElementById("btn-without").className = "mode-btn" + (mode === "without" ? " active" : "");
  renderAll();
}

function setChartRange(days) {
  chartRangeDays = days;
  [7, 30, 90, 0].forEach(d => {
    const el = document.getElementById("range-" + d);
    if (el) el.className = "range-btn" + (d === days ? " active" : "");
  });
  renderAll();
}

function toggleChartLine(key) {
  if (activeChartKeys.has(key)) {
    if (activeChartKeys.size > 1) activeChartKeys.delete(key);
  } else {
    activeChartKeys.add(key);
  }
  renderAll();
}

function selectBoxFromTable(boxId) {
  currentBoxId = boxId;
  renderAll();
  document.getElementById("detail-section").scrollIntoView({ behavior: "smooth" });
}

function parseTimestamp(tsStr) {
  return new Date(tsStr.replace(" ", "T") + ":00+09:00");
}

function getFilteredChartData() {
  if (!rawData.length || chartRangeDays === 0) return rawData;
  const latestTime = parseTimestamp(rawData[rawData.length - 1].timestamp).getTime();
  const cutoff = latestTime - (chartRangeDays * 24 * 60 * 60 * 1000);
  return rawData.filter(d => parseTimestamp(d.timestamp).getTime() >= cutoff);
}

function renderSummaryTable(latest, prev) {
  const tbody = document.querySelector("#summary-table tbody");
  let html = "";
  let lastCat = "";
  const suffix = shrinkMode === "with" ? "_with" : "_without";

  BOX_MASTER.forEach(item => {
    if (item.cat !== lastCat) {
      html += `<tr class="cat-row"><td colspan="5">${item.cat}</td></tr>`;
      lastCat = item.cat;
    }
    const currB = (latest.boxes && latest.boxes[item.id]) || {};
    const prevB = (prev.boxes && prev.boxes[item.id]) || {};

    const mVal = currB["mercari" + suffix];
    const yVal = currB["yahoo" + suffix];
    const sVal = currB["snkrdunk" + suffix];
    const hVal = currB["homura" + suffix];

    let profitHtml = "";
    if (hVal && item.retail) {
      const diff = hVal - item.retail;
      const sign = diff >= 0 ? "+" : "-";
      const cls = diff >= 0 ? "profit-pos" : "profit-neg";
      profitHtml = `<span class="${cls}">(${sign}¥${Math.abs(diff).toLocaleString()})</span>`;
    }

    html += `
      <tr class="box-row" onclick="selectBoxFromTable('${item.id}')">
        <td>
          <div class="box-title">${item.name}</div>
          <div class="box-meta">定¥${item.retail.toLocaleString()}${profitHtml}</div>
        </td>
        <td><span class="p-val">${fmt(mVal)}</span>${fmtDiffInline(mVal, prevB["mercari" + suffix])}</td>
        <td><span class="p-val">${fmt(yVal)}</span>${fmtDiffInline(yVal, prevB["yahoo" + suffix])}</td>
        <td><span class="p-val">${fmt(sVal)}</span>${fmtDiffInline(sVal, prevB["snkrdunk" + suffix])}</td>
        <td><span class="best-badge">${fmt(hVal)}</span>${fmtDiffInline(hVal, prevB["homura" + suffix])}</td>
      </tr>
    `;
  });
  tbody.innerHTML = html;
}

function renderTabs() {
  const container = document.getElementById("box-tabs");
  container.innerHTML = "";
  BOX_MASTER.forEach(item => {
    const btn = document.createElement("div");
    btn.className = "tab" + (item.id === currentBoxId ? " active" : "");
    btn.textContent = item.short;
    btn.onclick = () => { currentBoxId = item.id; renderAll(); };
    container.appendChild(btn);
  });
}

function renderAll() {
  if (!rawData.length) return;
  const latest = rawData[rawData.length - 1];
  const prev = rawData.length > 1 ? rawData[rawData.length - 2] : latest;

  document.getElementById("last-updated").textContent = `最終更新: ${latest.timestamp} （±は前回比 / 行タップでグラフ切替）`;

  renderSummaryTable(latest, prev);
  renderTabs();

  const currBox = latest.boxes[currentBoxId] || {};
  const prevBox = prev.boxes[currentBoxId] || {};
  const masterInfo = BOX_MASTER.find(b => b.id === currentBoxId) || {};

  document.getElementById("chart-title").textContent = `📈 ${masterInfo.name || ""}（定¥${(masterInfo.retail||0).toLocaleString()}）`;

  document.getElementById("price-cards").innerHTML = SERIES_CONFIG.map(cfg => {
    const val = currBox[cfg.key];
    const isOn = activeChartKeys.has(cfg.key);
    const btnStyle = isOn
      ? `background: ${cfg.color}25; color: ${cfg.color}; border-color: ${cfg.color};`
      : "";
    const btnText = isOn ? "📈 ON" : "OFF";

    let note = cfg.noteText;
    if (cfg.feeRate && val) {
      const pct = Math.round((1 - cfg.feeRate) * 100);
      note = `手数料${pct}%引: ¥${Math.round(val * cfg.feeRate).toLocaleString()}`;
    }

    return `
      <div class="card" onclick="toggleChartLine('${cfg.key}')">
        <div class="card-top">
          <span class="card-title">${cfg.label}</span>
          <span class="line-btn" style="${btnStyle}">${btnText}</span>
        </div>
        <div style="display:flex; align-items:baseline; gap:6px;">
          <span class="price">${fmt(val)}</span>
          ${fmtDiffInline(val, prevBox[cfg.key])}
        </div>
        ${note ? `<div class="sub-note">${note}</div>` : ""}
      </div>
    `;
  }).join("");

  const chartData = getFilteredChartData();
  const labels = chartData.map(d => d.timestamp.slice(5, 16));

  const activeConfigs = SERIES_CONFIG.filter(cfg => activeChartKeys.has(cfg.key));
  const allVisibleValues = [];

  const datasets = activeConfigs.map(cfg => {
    const dataArr = chartData.map(d => {
      const v = (d.boxes[currentBoxId] || {})[cfg.key] || null;
      if (v !== null) allVisibleValues.push(v);
      return v;
    });
    return {
      label: cfg.shortLabel,
      data: dataArr,
      borderColor: cfg.color,
      backgroundColor: cfg.color,
      borderDash: cfg.dash,
      borderWidth: 2,
      tension: 0.15,
      pointRadius: 2.5
    };
  });

  let yMin = undefined;
  let yMax = undefined;
  if (allVisibleValues.length > 0) {
    const minVal = Math.min(...allVisibleValues);
    const maxVal = Math.max(...allVisibleValues);
    const center = (minVal + maxVal) / 2;
    const actualSpan = maxVal - minVal;
    const minTargetSpan = Math.max(center * 0.25, 2500);
    const halfSpan = Math.max(actualSpan * 0.75, minTargetSpan / 2);

    yMin = Math.max(0, Math.floor((center - halfSpan) / 500) * 500);
    yMax = Math.ceil((center + halfSpan) / 500) * 500;
  }

  const ctx = document.getElementById("priceChart").getContext("2d");
  if (chartInstance) chartInstance.destroy();
  chartInstance = new Chart(ctx, {
    type: "line",
    data: { labels, datasets },
    options: {
      responsive: true,
      plugins: {
        legend: {
          labels: { color: "#f8fafc", font: { size: 10 }, boxWidth: 20 }
        }
      },
      scales: {
        x: { ticks: { color: "#94a3b8", font: { size: 10 } } },
        y: {
          min: yMin,
          max: yMax,
          ticks: {
            color: "#94a3b8",
            font: { size: 10 },
            callback: function(value) { return "¥" + value.toLocaleString(); }
          }
        }
      }
    }
  });

  const tbody = document.querySelector("#history-table tbody");
  tbody.innerHTML = rawData.slice(-10).reverse().map(d => {
    const b = d.boxes[currentBoxId] || {};
    return `
      <tr>
        <td>${d.timestamp.slice(5, 16)}</td>
        <td>${fmt(b.mercari_with)}<br><span style="color:#94a3b8">${fmt(b.mercari_without)}</span></td>
        <td>${fmt(b.yahoo_with)}<br><span style="color:#94a3b8">${fmt(b.yahoo_without)}</span></td>
        <td>${fmt(b.snkrdunk_with)}<br><span style="color:#94a3b8">${fmt(b.snkrdunk_without)}</span></td>
        <td>${fmt(b.homura_with)}<br><span style="color:#94a3b8">${fmt(b.homura_without)}</span></td>
      </tr>
    `;
  }).join("");
}

fetch("data.json?t=" + Date.now())
  .then(r => r.json())
  .then(data => { rawData = data; renderAll(); })
  .catch(() => {
    document.getElementById("last-updated").textContent = "まだデータがありません（初回実行をお待ちください）";
  });
</script>
</body>
</html>
